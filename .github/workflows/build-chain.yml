name: Build Chain (Rust Binary + IPK + APK)

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-core:
    name: 1. Build Rust Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: armv7-unknown-linux-musleabihf
          override: true

      - name: Install Rust deps
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add armv7-unknown-linux-musleabihf

      - name: Build Rust Binary
        working-directory: ./athena-led-bin
        run: |
          cargo build --release --target armv7-unknown-linux-musleabihf
          ls -lh target/armv7-unknown-linux-musleabihf/release/

      - name: Upload Rust Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-binary
          path: athena-led-bin/target/armv7-unknown-linux-musleabihf/release/athena-led-bin
          retention-days: 1

  build-packages:
    name: 2. Build ${{ matrix.fmt }} (${{ matrix.target }})
    needs: build-core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ipq807x-generic
            fmt: ipk
            sdk_url: https://downloads.openwrt.org/releases/23.05.5/targets/ipq807x/generic/openwrt-sdk-23.05.5-ipq807x-generic_gcc-12.3.0_musl.Linux-x86_64.tar.xz
            luci_branch: openwrt-23.05
            use_apk: "n"
          - target: qualcommax-ipq60xx
            fmt: apk
            sdk_url: https://downloads.openwrt.org/releases/25.12.0/targets/qualcommax/ipq60xx/openwrt-sdk-25.12.0-qualcommax-ipq60xx_gcc-13.3.0_musl.Linux-x86_64.tar.xz
            luci_branch: master
            use_apk: "y"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Rust Binary
        uses: actions/download-artifact@v4
        with:
          name: rust-binary
          path: ./rust-bin

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          
          # 强制重装 coreutils 确保 GNU install 生效（解决 23.05 ipk 预检失败）
          sudo apt-get install -y --reinstall coreutils
          sudo ln -sf /usr/bin/install /usr/local/bin/install
          
          # 基础编译工具链（Ubuntu 24.04 移除 python3-distutils，用 setuptools 替代）
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            python3-dev python3-pip python3-venv \
            bzip2 xz-utils liblz4-tool libncurses-dev \
            || true
          
          # 兜底：若预检仍找 distutils，用 setuptools 补足
          python3 -m pip install --break-system-packages --upgrade setuptools wheel || \
          python3 -m pip install --upgrade setuptools wheel
          
          echo "✅ Dependencies installed"
          install --version | head -n1
          python3 -c "import setuptools; print('setuptools:', setuptools.__version__)"

      - name: Prepare SDK
        run: |
          wget -q ${{ matrix.sdk_url }} -O sdk.tar.xz
          mkdir -p sdk
          tar -xf sdk.tar.xz -C sdk --strip-components=1
          rm sdk.tar.xz
          
          # 确保 install 环境变量
          export INSTALL="/usr/local/bin/install"
          echo "INSTALL=$INSTALL" >> $GITHUB_ENV

      - name: Configure Feeds
        working-directory: ./sdk
        run: |
          export FORCE=1
          ./scripts/feeds update -a FORCE=1
          ./scripts/feeds install -a FORCE=1

      - name: Verify luci-base
        working-directory: ./sdk
        run: |
          export FORCE=1
          if [ -d "feeds/luci" ]; then
            echo "✅ luci feed present"
            ls feeds/luci/ | head -n 10
          else
            echo "⚠️ luci feed missing, cloning manually"
            git clone --depth 1 -b ${{ matrix.luci_branch }} https://github.com/openwrt/luci.git feeds/luci
            ./scripts/feeds install -a FORCE=1
          fi

      - name: Inject Packages Into SDK
        run: |
          chmod +x ./rust-bin/athena-led-bin
          
          mkdir -p sdk/package/athena-led
          cp "$GITHUB_WORKSPACE/athena-led/Makefile" sdk/package/athena-led/
          cp -r "$GITHUB_WORKSPACE/athena-led/files" sdk/package/athena-led/
          
          # 注入编译好的 Rust 二进制
          mkdir -p sdk/package/athena-led/files/usr/bin
          cp ./rust-bin/athena-led-bin sdk/package/athena-led/files/usr/bin/
          chmod +x sdk/package/athena-led/files/usr/bin/athena-led-bin
          
          mkdir -p sdk/package/luci-app-athena-led
          cp -r "$GITHUB_WORKSPACE/luci-app-athena-led"/* sdk/package/luci-app-athena-led/

          find sdk/package/athena-led sdk/package/luci-app-athena-led \
            -type f ! -name "*.bin" ! -name "athena-led-bin" ! -name "*.png" \
            -exec dos2unix {} +

          echo "✅ Packages injected"

      - name: Compile Packages
        working-directory: ./sdk
        run: |
          export FORCE=1
          export INSTALL="/usr/local/bin/install"
          
          cat > .config <<EOF
          CONFIG_SIGNED_PACKAGES=n
          CONFIG_SIGN_EACH_PACKAGE=n
          CONFIG_USE_APK=${{ matrix.use_apk }}
          CONFIG_PACKAGE_athena-led=m
          CONFIG_PACKAGE_luci-app-athena-led=m
          EOF

          # 预检强制放行（应对 23.05 install 等宿主依赖检查）
          make defconfig FORCE=1

          echo "=== Building luci-base ==="
          make package/luci-base/compile V=s -j$(nproc) FORCE=1 || echo "⚠️ luci-base failed, continuing"

          if [ "${{ matrix.use_apk }}" = "y" ]; then
            echo "=== Building luci-lua-runtime & luci-compat ==="
            make package/luci-lua-runtime/compile V=s -j$(nproc) FORCE=1 || echo "⚠️ luci-lua-runtime failed"
            make package/luci-compat/compile V=s -j$(nproc) FORCE=1 || echo "⚠️ luci-compat failed"
          fi

          echo "=== Building athena-led ==="
          make package/athena-led/compile V=s -j$(nproc) FORCE=1 || { echo "❌ athena-led failed"; exit 1; }

          echo "=== Building luci-app-athena-led ==="
          make package/luci-app-athena-led/compile V=s -j$(nproc) FORCE=1 || { echo "❌ luci-app-athena-led failed"; exit 1; }

          echo "=== Build artifacts ==="
          find bin/ -name "*athena-led*" \( -name "*.ipk" -o -name "*.apk" \) -ls

      - name: Generate checksums
        run: |
          cd sdk/bin
          find . -name "*athena-led*" \( -name "*.ipk" -o -name "*.apk" \) -type f | while read f; do
            sha256sum "$f"
          done | sed 's# \./[^/]*/# #' > sha256sums-athena-led.txt
          cat sha256sums-athena-led.txt

      - name: Upload Packages as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: athena-led-${{ matrix.target }}-${{ matrix.fmt }}
          path: |
            sdk/bin/**/*athena-led*.ipk
            sdk/bin/**/*athena-led*.apk
            sdk/bin/sha256sums-athena-led.txt
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: actions/softprops/action-gh-release@v1
        with:
          files: |
            sdk/bin/**/*athena-led*.ipk
            sdk/bin/**/*athena-led*.apk
            sdk/bin/sha256sums-athena-led.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
