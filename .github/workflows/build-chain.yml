name: Build Chain (Rust Binary + IPK + APK)

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-rust-core:
    name: Build Rust Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          override: true

      - name: Install Rust build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools coreutils
          sudo ln -sf /usr/bin/install /usr/local/bin/install

      - name: Build Rust binary
        working-directory: ./rust-core
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          mkdir -p ../sdk/staging_dir/host/bin
          cp target/x86_64-unknown-linux-musl/release/athena-led ../sdk/staging_dir/host/bin/ 2>/dev/null || \
          cp target/x86_64-unknown-linux-musl/release/athena-led-* ../sdk/staging_dir/host/bin/ 2>/dev/null || \
          echo "Binary built, check path manually"
        continue-on-error: true

      - name: Upload Rust Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-binary
          path: ./rust-core/target/x86_64-unknown-linux-musl/release/
          retention-days: 7

  build-ipk:
    name: Build ipk (ipq807x-generic)
    needs: build-rust-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Rust Binary
        uses: actions/download-artifact@v4
        with:
          name: rust-binary
          path: ./rust-binary

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --reinstall coreutils build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            python3-dev python3-pip python3-venv bzip2 xz-utils liblz4-tool \
            || true
          python3 -m pip install --break-system-packages --upgrade setuptools wheel || \
          python3 -m pip install --upgrade setuptools wheel
          sudo ln -sf /usr/bin/install /usr/local/bin/install
          install --version | head -n1

      - name: Prepare SDK (OpenWrt 23.05)
        run: |
          # 这里假设你有下载/解压 SDK 的逻辑，保留原逻辑
          # 示例：wget ... && tar -xvf ...
          echo "Prepare SDK for ipq807x (23.05)"
          ls -la

      - name: Configure Feeds
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Packages Into SDK
        run: |
          cp -rf ./package/athena-led ./sdk/package/ 2>/dev/null || true
          cp -rf ./package/luci-app-athena-led ./sdk/package/ 2>/dev/null || true
          mkdir -p ./sdk/staging_dir/host/bin
          cp ./rust-binary/athena-led* ./sdk/staging_dir/host/bin/ 2>/dev/null || true

      - name: Compile Packages (IPK)
        working-directory: ./sdk
        run: |
          export FORCE=1
          export INSTALL="/usr/local/bin/install"
          cat > .config <<EOF
          CONFIG_SIGNED_PACKAGES=n
          CONFIG_SIGN_EACH_PACKAGE=n
          CONFIG_USE_APK=n
          CONFIG_PACKAGE_athena-led=m
          CONFIG_PACKAGE_luci-app-athena-led=m
          EOF
          make defconfig FORCE=1
          make package/luci-base/compile V=s -j$(nproc) FORCE=1 || echo "⚠️ luci-base failed"
          make package/athena-led/compile V=s -j$(nproc) FORCE=1 || { echo "❌ athena-led failed"; exit 1; }
          make package/luci-app-athena-led/compile V=s -j$(nproc) FORCE=1 || { echo "❌ luci-app failed"; exit 1; }
          find bin/ -name "*athena-led*.ipk" -ls

      - name: Upload IPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: athena-led-ipq807x-ipk
          path: sdk/bin/**/*.ipk
          retention-days: 30

  build-apk:
    name: Build apk (qualcommax-ipq60xx)
    needs: build-rust-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Rust Binary
        uses: actions/download-artifact@v4
        with:
          name: rust-binary
          path: ./rust-binary

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --reinstall coreutils build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            python3-dev python3-pip python3-venv bzip2 xz-utils liblz4-tool \
            || true
          python3 -m pip install --break-system-packages --upgrade setuptools wheel || \
          python3 -m pip install --upgrade setuptools wheel
          sudo ln -sf /usr/bin/install /usr/local/bin/install
          install --version | head -n1

      - name: Prepare SDK (OpenWrt main/25.12)
        run: |
          echo "Prepare SDK for ipq60xx (APK/main)"
          ls -la

      - name: Configure Feeds
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Packages Into SDK
        run: |
          cp -rf ./package/athena-led ./sdk/package/ 2>/dev/null || true
          cp -rf ./package/luci-app-athena-led ./sdk/package/ 2>/dev/null || true
          mkdir -p ./sdk/staging_dir/host/bin
          cp ./rust-binary/athena-led* ./sdk/staging_dir/host/bin/ 2>/dev/null || true

      - name: Compile Packages (APK)
        working-directory: ./sdk
        run: |
          export FORCE=1
          export INSTALL="/usr/local/bin/install"
          cat > .config <<EOF
          CONFIG_SIGNED_PACKAGES=n
          CONFIG_SIGN_EACH_PACKAGE=n
          CONFIG_USE_APK=y
          CONFIG_PACKAGE_athena-led=m
          CONFIG_PACKAGE_luci-app-athena-led=m
          EOF
          make defconfig FORCE=1
          make package/luci-base/compile V=s -j$(nproc) FORCE=1 || echo "⚠️ luci-base failed"
          make package/luci-lua-runtime/compile V=s -j$(nproc) FORCE=1 || echo "⚠️ lua-runtime failed"
          make package/luci-compat/compile V=s -j$(nproc) FORCE=1 || echo "⚠️ compat failed"
          make package/athena-led/compile V=s -j$(nproc) FORCE=1 || { echo "❌ athena-led failed"; exit 1; }
          make package/luci-app-athena-led/compile V=s -j$(nproc) FORCE=1 || { echo "❌ luci-app failed"; exit 1; }
          find bin/ -name "*athena-led*.apk" -ls

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: athena-led-ipq60xx-apk
          path: sdk/bin/**/*.apk
          retention-days: 30
