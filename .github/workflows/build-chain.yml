name: Build Chain (Rust Binary + IPK + APK)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 统一版本号，避免两处定义不一致
  OPENWRT_23_VER: "23.05.5"
  OPENWRT_25_VER: "25.12.0"

jobs:
  # 🟢 第一阶段：编译 Rust 核心二进制
  build_rust:
    name: 1. Build Rust Core
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Get Version
        id: version
        run: |
          MAKEFILE_PATH="athena-led/Makefile"
          if [ ! -f "$MAKEFILE_PATH" ]; then
            echo "⚠️ $MAKEFILE_PATH not found, using default version 1.0.0"
            PKG_VERSION="1.0.0"
          else
            PKG_VERSION=$(grep "PKG_VERSION:=" "$MAKEFILE_PATH" | cut -d"=" -f2 | tr -d '[:space:]')
            echo "✅ Found version $PKG_VERSION in $MAKEFILE_PATH"
          fi
          echo "VERSION=$PKG_VERSION" >> $GITHUB_OUTPUT

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install Zig & Zigbuild
        run: |
          pip3 install cargo-zigbuild ziglang

      - name: Compile Rust
        working-directory: ./athena-led
        run: |
          set +e
          cargo zigbuild --release --target aarch64-unknown-linux-musl 2>&1 | tee /tmp/build.log
          RC=${PIPESTATUS[0]}
          echo "### Compile Rust output (exit $RC)" >> "$GITHUB_STEP_SUMMARY"
          grep -E "error\[|error:|warning: unused" /tmp/build.log | head -50 >> "$GITHUB_STEP_SUMMARY"
          grep -E "error\[|error:" /tmp/build.log | head -30 | while read -r line; do
            echo "::error::$line"
          done
          exit $RC

      - name: Strip & Stage Binary
        working-directory: ./athena-led
        run: |
          mkdir -p files
          cp target/aarch64-unknown-linux-musl/release/athena-led files/athena-led-bin
          # 剥离符号表减小体积（你之前 3.74MB → 预计降到 ~2MB，和 CI 产物一致）
          aarch64-linux-musl-strip files/athena-led-bin 2>/dev/null || \
          aarch64-linux-gnu-strip --strip-unneeded files/athena-led-bin 2>/dev/null || \
          strip --strip-unneeded files/athena-led-bin 2>/dev/null || true
          chmod +x files/athena-led-bin
          echo "✅ Staged binary -> files/athena-led-bin ($(ls -la files/athena-led-bin | awk '{print $5}') bytes)"
          file files/athena-led-bin

      - name: Upload Rust Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-binary
          path: athena-led/files/athena-led-bin
          retention-days: 1

  # 🔵 第二阶段：编译 OpenWrt 包（ipk + apk 双格式）
  build_openwrt:
    name: 2. Build ${{ matrix.fmt }} (${{ matrix.target }})
    needs: build_rust
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ipq807x-generic
            fmt: ipk
            sdk_url: "https://downloads.openwrt.org/releases/${{ env.OPENWRT_23_VER }}/targets/ipq807x/generic"
            use_apk: n
          - target: qualcommax-ipq60xx
            fmt: apk
            sdk_url: "https://downloads.openwrt.org/releases/${{ env.OPENWRT_25_VER }}/targets/qualcommax/ipq60xx"
            use_apk: y

    steps:
      - uses: actions/checkout@v4

      - name: Download Rust Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: rust-binary
          path: athena-led/files/

      - name: Verify Binary
        run: |
          ls -la athena-led/files/athena-led-bin
          file athena-led/files/athena-led-bin

      # 🔧 一次性装齐所有构建依赖（根治 GNU install 预检失败）
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib gperf libssl-dev libelf-dev libgnutls28-dev \
            libtool libxml-parser-perl \
            coreutils findutils zstd tar wget cpio rsync unzip \
            python3 python3-pyelftools python3-setuptools \
            file dos2unix
          # 确认 GNU install 可用
          which install && install --version | head -1

      - name: Prepare SDK
        run: |
          BASE_URL="${{ matrix.sdk_url }}"
          echo "📦 Fetching SDK from $BASE_URL"

          if ! wget -q --spider "$BASE_URL/"; then
            echo "::error::Cannot reach $BASE_URL — 该 SDK 目录可能不存在"
            exit 8
          fi

          if ! wget -q "$BASE_URL/sha256sums" -O sha256sums; then
            echo "::error::Failed to download sha256sums from $BASE_URL"
            exit 8
          fi

          SDK_FILE=$(grep "openwrt-sdk.*Linux-x86_64" sha256sums | head -1 | awk '{print $2}' | sed 's/*//g')
          echo "📦 SDK file: $SDK_FILE"

          if [ -z "$SDK_FILE" ]; then
            echo "::error::No SDK file found in $BASE_URL"
            echo "::error::Available files:"
            cat sha256sums
            exit 8
          fi

          wget -q "$BASE_URL/$SDK_FILE" || { echo "::error::Failed to download $SDK_FILE"; exit 8; }

          if [[ "$SDK_FILE" == *.xz ]]; then
            tar -xf "$SDK_FILE"
          elif [[ "$SDK_FILE" == *.zst ]]; then
            zstd -d "$SDK_FILE" -o sdk.tar
            tar -xf sdk.tar
          else
            tar -xf "$SDK_FILE"
          fi

          EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name "openwrt-sdk-*" | head -n 1)
          if [ -z "$EXTRACTED_DIR" ]; then
            echo "::error::Cannot find extracted SDK directory"
            ls -la
            exit 8
          fi
          mv "$EXTRACTED_DIR" sdk
          echo "✅ SDK ready: $EXTRACTED_DIR → ./sdk"

      # 🔧 关键：用上游 release tarball 手工喂 luci 依赖，不依赖 feeds 更新
      - name: Prepare LuCI dependencies from release tarballs
        working-directory: ./sdk
        run: |
          OW_VER="${{ matrix.use_apk == 'y' && env.OPENWRT_25_VER || env.OPENWRT_23_VER }}"
          echo "📦 Preparing LuCI feeds for OpenWrt $OW_VER"

          mkdir -p dl tmp-luci
          cd tmp-luci

          # 下载 luci release 源码包（含 luci-base、luci-lib-*、po2lmo 等）
          echo "=== Downloading luci source ==="
          wget -q "https://github.com/openwrt/luci/archive/refs/tags/v${OW_VER}.tar.gz" -O luci.tar.gz || \
          wget -q "https://github.com/openwrt/luci/archive/refs/heads/openwrt-${OW_VER%.*}.tar.gz" -O luci.tar.gz || \
          { echo "::error::Cannot download luci source"; exit 8; }
          tar -xzf luci.tar.gz
          LUCI_DIR=$(find . -maxdepth 1 -type d -name "luci-*" | head -n 1)
          echo "✅ LuCI source: $LUCI_DIR"

          # 下载 packages feed（含 lua、luabitop 等运行时）
          echo "=== Downloading packages feed ==="
          wget -q "https://github.com/openwrt/packages/archive/refs/tags/v${OW_VER}.tar.gz" -O packages.tar.gz || \
          wget -q "https://github.com/openwrt/packages/archive/refs/heads/openwrt-${OW_VER%.*}.tar.gz" -O packages.tar.gz || true
          if [ -f packages.tar.gz ]; then
            tar -xzf packages.tar.gz
            PKGS_DIR=$(find . -maxdepth 1 -type d -name "packages-*" | head -n 1)
            echo "✅ Packages feed: $PKGS_DIR"
          fi

          # 把需要的包复制到 SDK 的 package/ 目录（模拟 feeds install）
          cd "$GITHUB_WORKSPACE/sdk/package" || mkdir -p "$GITHUB_WORKSPACE/sdk/package"
          PKG_DST="$GITHUB_WORKSPACE/sdk/package"

          # luci-base 是必选项
          if [ -d "$GITHUB_WORKSPACE/sdk/tmp-luci/$LUCI_DIR/modules/luci-base" ]; then
            cp -r "$GITHUB_WORKSPACE/sdk/tmp-luci/$LUCI_DIR/modules/luci-base" "$PKG_DST/"
            echo "✅ Installed luci-base"
          fi

          # 25.12 需要 lua 运行时
          if [ "${{ matrix.use_apk }}" = "y" ]; then
            for m in luci-lua-runtime luci-compat; do
              if [ -d "$GITHUB_WORKSPACE/sdk/tmp-luci/$LUCI_DIR/modules/$m" ]; then
                cp -r "$GITHUB_WORKSPACE/sdk/tmp-luci/$LUCI_DIR/modules/$m" "$PKG_DST/"
                echo "✅ Installed $m"
              fi
            done
            # lua 主程序来自 packages feed
            if [ -n "$PKGS_DIR" ] && [ -d "$GITHUB_WORKSPACE/sdk/tmp-luci/$PKGS_DIR/lang/lua" ]; then
              cp -r "$GITHUB_WORKSPACE/sdk/tmp-luci/$PKGS_DIR/lang/lua" "$PKG_DST/" 2>/dev/null || true
            fi
          fi

          # 列出 SDK 里现在有哪些包
          echo "=== SDK packages ==="
          ls -la "$PKG_DST/"

          # 清理
          cd "$GITHUB_WORKSPACE" && rm -rf sdk/tmp-luci

      - name: Configure & Inject Packages
        run: |
          # 把我们的包注入 SDK
          mkdir -p sdk/package/athena-led sdk/package/luci-app-athena-led
          cp "$GITHUB_WORKSPACE/athena-led/Makefile" sdk/package/athena-led/
          cp -r "$GITHUB_WORKSPACE/athena-led/files" sdk/package/athena-led/
          cp -r "$GITHUB_WORKSPACE/luci-app-athena-led"/* sdk/package/luci-app-athena-led/

          # 转换行符（排除二进制）
          find sdk/package -type f \
            ! -name "*.bin" ! -name "athena-led-bin" ! -name "*.png" \
            -exec dos2unix {} +

          echo "✅ All packages injected"

      - name: Compile Packages
        working-directory: ./sdk
        run: |
          # 写 .config
          cat > .config <<EOF
          CONFIG_SIGNED_PACKAGES=n
          CONFIG_SIGN_EACH_PACKAGE=n
          CONFIG_USE_APK=${{ matrix.use_apk }}
          CONFIG_PACKAGE_athena-led=m
          CONFIG_PACKAGE_luci-app-athena-led=m
          EOF

          make defconfig

          # 先编 luci-base（提供 po2lmo 等工具）
          echo "=== Building luci-base ==="
          make package/luci-base/compile V=s -j$(nproc) FORCE=1 || { echo "❌ luci-base failed"; exit 1; }

          # 25.12 额外依赖
          if [ "${{ matrix.use_apk }}" = "y" ]; then
            echo "=== Building lua runtime ==="
            make package/lua/compile V=s -j$(nproc) FORCE=1 || echo "⚠️ lua skipped"
            make package/luci-lua-runtime/compile V=s -j$(nproc) FORCE=1 || echo "⚠️ luci-lua-runtime skipped"
            make package/luci-compat/compile V=s -j$(nproc) FORCE=1 || echo "⚠️ luci-compat skipped"
          fi

          # 编 athena-led
          echo "=== Building athena-led ==="
          make package/athena-led/compile V=s -j$(nproc) FORCE=1 || { echo "❌ athena-led failed"; exit 1; }

          # 编 luci-app
          echo "=== Building luci-app-athena-led ==="
          make package/luci-app-athena-led/compile V=s -j$(nproc) FORCE=1 || { echo "❌ luci-app-athena-led failed"; exit 1; }

          # 列出产物
          echo "=== Build artifacts ==="
          find bin/ -name "*athena-led*" \( -name "*.ipk" -o -name "*.apk" \) -ls

      - name: Generate checksums
        run: |
          cd sdk/bin
          find . -name "*athena-led*" \( -name "*.ipk" -o -name "*.apk" \) -type f | while read f; do
            sha256sum "$f"
          done | sed 's# \./[^/]*/# #' > sha256sums-athena-led.txt
          cat sha256sums-athena-led.txt

      - name: Upload Packages as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: athena-led-${{ matrix.target }}-${{ matrix.fmt }}
          path: |
            sdk/bin/**/*athena-led*.ipk
            sdk/bin/**/*athena-led*.apk
            sdk/bin/sha256sums-athena-led.txt
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            sdk/bin/**/*athena-led*.ipk
            sdk/bin/**/*athena-led*.apk
            sdk/bin/sha256sums-athena-led.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
