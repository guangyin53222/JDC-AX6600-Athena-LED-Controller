name: Build Chain (Rust Binary + IPK + APK)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_rust:
    name: 1. Build Rust Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Version
        id: version
        run: |
          MAKEFILE_PATH="athena-led/Makefile"
          if [ ! -f "$MAKEFILE_PATH" ]; then
            echo "⚠️ $MAKEFILE_PATH not found, using default version 1.0.0"
            PKG_VERSION="1.0.0"
          else
            PKG_VERSION=$(grep "PKG_VERSION:=" "$MAKEFILE_PATH" | cut -d"=" -f2 | tr -d '[:space:]')
            echo "✅ Found version $PKG_VERSION in $MAKEFILE_PATH"
          fi
          echo "VERSION=$PKG_VERSION" >> $GITHUB_OUTPUT

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install Zig & Zigbuild
        run: |
          pip3 install cargo-zigbuild ziglang

      - name: Compile Rust
        working-directory: ./athena-led
        run: |
          set +e
          cargo zigbuild --release --target aarch64-unknown-linux-musl 2>&1 | tee /tmp/build.log
          RC=${PIPESTATUS[0]}
          echo "### Compile Rust output (exit $RC)" >> "$GITHUB_STEP_SUMMARY"
          grep -E "error\[|error:|warning: unused" /tmp/build.log | head -50 >> "$GITHUB_STEP_SUMMARY"
          grep -E "error\[|error:" /tmp/build.log | head -30 | while read -r line; do
            echo "::error::$line"
          done
          exit $RC

      - name: Strip Binary
        working-directory: ./athena-led
        run: |
          aarch64-linux-musl-strip target/aarch64-unknown-linux-musl/release/athena-led || true

      - name: Stage Binary into package files/
        working-directory: ./athena-led
        run: |
          mkdir -p files
          cp target/aarch64-unknown-linux-musl/release/athena-led files/athena-led-bin
          chmod +x files/athena-led-bin
          echo "✅ Staged binary -> files/athena-led-bin ($(ls -la files/athena-led-bin | awk '{print $5}') bytes)"
          file files/athena-led-bin

      - name: Upload Rust Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-binary
          path: athena-led/files/athena-led-bin
          retention-days: 1

  build_openwrt:
    name: 2. Build ${{ matrix.fmt }} (${{ matrix.target }})
    needs: build_rust
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ipq807x-generic
            fmt: ipk
            sdk_url: "https://downloads.openwrt.org/releases/23.05.5/targets/ipq807x/generic"
            use_apk: "n"
            luci_branch: "openwrt-23.05"
          - target: qualcommax-ipq60xx
            fmt: apk
            sdk_url: "https://downloads.openwrt.org/releases/25.12.0/targets/qualcommax/ipq60xx"
            use_apk: "y"
            luci_branch: "openwrt-25.12"

    steps:
      - uses: actions/checkout@v4

      - name: Download Rust Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: rust-binary
          path: athena-led/files/

      - name: Verify Binary
        run: |
          ls -la athena-led/files/athena-led-bin
          file athena-led/files/athena-led-bin

      - name: Install host build dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y coreutils findutils zstd tar wget dos2unix build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync unzip python3 || true

      - name: Prepare SDK
        run: |
          BASE_URL="${{ matrix.sdk_url }}"
          echo "📦 Fetching SDK from $BASE_URL"

          if ! wget -q --spider "$BASE_URL/sha256sums"; then
            echo "::error::Cannot reach $BASE_URL/sha256sums — SDK path invalid"
            exit 8
          fi
          wget -q "$BASE_URL/sha256sums" -O sha256sums

          SDK_FILE=$(grep "openwrt-sdk.*Linux-x86_64" sha256sums | head -1 | awk '{print $2}' | sed 's/*//g')
          echo "📦 SDK file: $SDK_FILE"

          if [ -z "$SDK_FILE" ]; then
            echo "::error::No SDK file found"
            cat sha256sums
            exit 8
          fi

          wget -q "$BASE_URL/$SDK_FILE" || { echo "::error::Failed to download $SDK_FILE"; exit 8; }

          if [[ "$SDK_FILE" == *.xz ]]; then
            tar -xf "$SDK_FILE"
          elif [[ "$SDK_FILE" == *.zst ]]; then
            zstd -d "$SDK_FILE" -o sdk.tar
            tar -xf sdk.tar
          else
            tar -xf "$SDK_FILE"
          fi

          EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name "openwrt-sdk-*" | head -n 1)
          if [ -z "$EXTRACTED_DIR" ]; then
            echo "::error::Cannot find extracted SDK dir"
            ls -la
            exit 8
          fi
          mv "$EXTRACTED_DIR" sdk
          echo "✅ SDK ready: $EXTRACTED_DIR → ./sdk"

      - name: Configure Feeds
        working-directory: ./sdk
        run: |
          cp feeds.conf.default feeds.conf.default.bak
          sed -i 's|git.openwrt.org/openwrt/openwrt.git|github.com/openwrt/openwrt.git|g' feeds.conf.default
          sed -i 's|git.openwrt.org/feed/packages.git|github.com/openwrt/packages.git|g' feeds.conf.default
          sed -i 's|git.openwrt.org/project/luci.git|github.com/openwrt/luci.git|g' feeds.conf.default

          if ! grep -q "luci" feeds.conf.default; then
            echo "src-git luci https://github.com/openwrt/luci.git;${{ matrix.luci_branch }}" >> feeds.conf.default
          fi

          cat feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install luci-base
          if [ "${{ matrix.use_apk }}" = "y" ]; then
            ./scripts/feeds install luci-lua-runtime luci-compat
          fi

      - name: Verify luci-base
        working-directory: ./sdk
        run: |
          if ! ./scripts/feeds list | grep -q "^luci-base"; then
            echo "::warning::luci-base not in feeds list, will rely on manual inject"
          else
            echo "✅ luci-base found in feeds"
          fi

      - name: Inject Packages into SDK
        run: |
          sudo apt-get install -y dos2unix || true

          mkdir -p sdk/package/athena-led
          cp "$GITHUB_WORKSPACE/athena-led/Makefile" sdk/package/athena-led/
          cp -r "$GITHUB_WORKSPACE/athena-led/files" sdk/package/athena-led/

          mkdir -p sdk/package/luci-app-athena-led
          cp -r "$GITHUB_WORKSPACE/luci-app-athena-led"/* sdk/package/luci-app-athena-led/

          find sdk/package/athena-led sdk/package/luci-app-athena-led \
            -type f ! -name "*.bin" ! -name "athena-led-bin" ! -name "*.png" \
            -exec dos2unix {} +

          echo "✅ Packages injected"

      - name: Compile Packages
        working-directory: ./sdk
        run: |
          cat > .config <<EOF
          CONFIG_SIGNED_PACKAGES=n
          CONFIG_SIGN_EACH_PACKAGE=n
          CONFIG_USE_APK=${{ matrix.use_apk }}
          CONFIG_PACKAGE_athena-led=m
          CONFIG_PACKAGE_luci-app-athena-led=m
          EOF

          make defconfig

          echo "=== Building luci-base ==="
          make package/luci-base/compile V=s -j$(nproc) FORCE=1 || echo "⚠️ luci-base failed, continuing"

          if [ "${{ matrix.use_apk }}" = "y" ]; then
            echo "=== Building luci-lua-runtime & luci-compat ==="
            make package/luci-lua-runtime/compile V=s -j$(nproc) FORCE=1 || echo "⚠️ luci-lua-runtime failed"
            make package/luci-compat/compile V=s -j$(nproc) FORCE=1 || echo "⚠️ luci-compat failed"
          fi

          echo "=== Building athena-led ==="
          make package/athena-led/compile V=s -j$(nproc) FORCE=1 || { echo "❌ athena-led failed"; exit 1; }

          echo "=== Building luci-app-athena-led ==="
          make package/luci-app-athena-led/compile V=s -j$(nproc) FORCE=1 || { echo "❌ luci-app-athena-led failed"; exit 1; }

          echo "=== Build artifacts ==="
          find bin/ -name "*athena-led*" \( -name "*.ipk" -o -name "*.apk" \) -ls

      - name: Generate checksums
        run: |
          cd sdk/bin
          find . -name "*athena-led*" \( -name "*.ipk" -o -name "*.apk" \) -type f | while read f; do
            sha256sum "$f"
          done | sed 's# \./[^/]*/# #' > sha256sums-athena-led.txt
          cat sha256sums-athena-led.txt

      - name: Upload Packages as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: athena-led-${{ matrix.target }}-${{ matrix.fmt }}
          path: |
            sdk/bin/**/*athena-led*.ipk
            sdk/bin/**/*athena-led*.apk
            sdk/bin/sha256sums-athena-led.txt
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            sdk/bin/**/*athena-led*.ipk
            sdk/bin/**/*athena-led*.apk
            sdk/bin/sha256sums-athena-led.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
